<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRIS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        /* Halaman pengunjung: HANYA QR + tombol unduh + "scan qr".
           Disengaja tidak ada nama penyedia, tidak ada pemetaan, dan tidak
           ada nama file QR di halaman ini. QR diambil dari Worker (/qr),
           jadi nama penyedia tidak bisa dibaca dari halaman ini. */
        * { box-sizing: border-box; }
        body {
            background: #FAFAF8;
            color: #111111;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        main { width: 100%; max-width: 460px; animation: rise .6s ease both; }
        .card {
            background: #FFFFFF;
            border: 1px solid #E7E7E3;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            padding: 24px;
            animation: rise .6s ease .1s both;
        }
        .qr-container {
            background: #FFFFFF;
            border-radius: 12px;
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .qr-container img { max-width: 100%; height: auto; display: block; }
        .instruction {
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            color: #4B5563;
            margin: 20px 0 0;
        }
        .download-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            background: #111111;
            color: #FFFFFF;
            font-weight: 600;
            font-size: 15px;
            padding: 13px 16px;
            border-radius: 999px;
            margin-top: 20px;
            transition: background .2s ease, transform .2s ease;
        }
        .download-btn:hover { background: #000000; transform: translateY(-1px); }
        .not-set {
            text-align: center;
            font-size: 14px;
            color: #6B7280;
            background: #FFFFFF;
            border: 1px dashed #D1D5DB;
            border-radius: 16px;
            padding: 24px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <main>
        <!-- QR tampil hanya kalau Worker mengembalikan gambar (admin sudah set).
             Kalau belum diset / Worker error, section ini tetap tersembunyi
             dan hanya catatan "QRIS belum diatur" yang tampil. -->
        <section id="qr-section" class="card hidden" aria-label="QRIS Payment Scanner">
            <div class="qr-container">
                <img id="qr-img" src="" alt="QRIS">
            </div>
            <p class="instruction">scan qr</p>
            <a id="qr-download" class="download-btn" href="" download="qris-aufa-eu-cc.png">Unduh QRIS &darr;</a>
        </section>

        <div id="not-set-note" class="not-set hidden">
            QRIS belum diatur.
        </div>
    </main>

    <script>
        // URL Worker yang sudah di-deploy:
        // misalnya https://aufa-qris.<subdomain>.workers.dev (tanpa garis miring di akhir).
        var WORKER_URL = "https://aufa-qris.qriscode.workers.dev";
        (function () {
            var img = document.getElementById('qr-img');
            var dl = document.getElementById('qr-download');
            var ts = Date.now();
            dl.href = WORKER_URL + '/qr-download?ts=' + ts;
            img.onload = function () {
                document.getElementById('qr-section').classList.remove('hidden');
            };
            img.onerror = function () {
                document.getElementById('not-set-note').classList.remove('hidden');
            };
            img.src = WORKER_URL + '/qr?ts=' + ts;
        })();
    </script>
</body>
</html>
