<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUFA.EU.CC - Secure Payment</title>
    
    <!-- Memuat Tailwind CSS untuk layout responsif dasar -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Mengimpor font Roboto Mono untuk kredibilitas teknis & Inter sebagai fallback Violetsans */
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Inter:wght@400;600&display=swap');

        :root {
            /* 2. Color Palette & Roles dari design.md */
            --bg-primary: #09090E;
            --bg-surface: #0A090F;
            --border-dark: #353539;
            --text-primary: #EFEFE5;
            --text-emphasis: #FFFFFF;
            --accent-purple: #5529D3;
            --accent-hover: #7D63FF;
            --subtle-purple-shadow: rgba(85, 41, 211, 0.1);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            /* Font primer: Violetsans dengan fallback Inter */
            font-family: 'Violetsans', 'Inter', -apple-system, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .font-mono {
            font-family: 'Roboto Mono', monospace;
        }

        /* 4. Component Stylings: Feature Card */
        .card {
            background: rgba(0, 0, 0, 0);
            border: 1px solid var(--border-dark);
            border-radius: 0px; /* Zero border radius policy */
            padding: 24px 32px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            border-color: var(--accent-hover);
            box-shadow: 0 0 24px rgba(85, 41, 211, 0.15);
        }

        .qr-container {
            background: #FFFFFF; /* Latar putih agar QR dapat di-scan dengan baik */
            border: 1px solid var(--border-dark);
            padding: 16px;
            border-radius: 0px;
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

<comment-tag id="1">        .qr-container img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .gap-micro { gap: 4px; }
        .gap-tight { gap: 8px; }
        .gap-standard { gap: 16px; }
        .gap-generous { gap: 24px; }
        .gap-section { gap: 32px; }
    </style>
</head>
<body class="p-4 sm:p-8">

                AUFA.EU.CC
            </h1>
        </header>

        <section class="card flex flex-col gap-generous" aria-label="QRIS Payment Scanner">

    </main>

</body>
</html>
