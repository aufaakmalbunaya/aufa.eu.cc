<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRIS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap');
        /* Gaya terinspirasi situs personal bersih seperti devrangga.dev dan
           hidaffa.com: latar terang, headline besar, ruang putih lega,
           kartu putih dengan bayangan lembut, dan gerak masuk yang halus.
           Isi dan logika QRIS tidak berubah. */
        * { box-sizing: border-box; }
        body {
            background: #FAFAF8;
            color: #111111;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        main { width: 100%; max-width: 460px; animation: rise .6s ease both; }
        .card {
            background: #FFFFFF;
            border: 1px solid #E7E7E3;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            padding: 24px;
            animation: rise .6s ease .1s both;
        }
        .qr-container {
            background: #FFFFFF;
            border-radius: 12px;
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .qr-container img { max-width: 100%; height: auto; display: block; }
        .instruction {
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            color: #4B5563;
            margin: 20px 0 0;
        }
        .download-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            background: #111111;
            color: #FFFFFF;
            font-weight: 600;
            font-size: 15px;
            padding: 13px 16px;
            border-radius: 999px;
            margin-top: 20px;
            transition: background .2s ease, transform .2s ease;
        }
        .download-btn:hover { background: #000000; transform: translateY(-1px); }
        .download-btn:active { transform: translateY(0); }
        .not-set {
            text-align: center;
            font-size: 14px;
            color: #6B7280;
            background: #FFFFFF;
            border: 1px dashed #D1D5DB;
            border-radius: 16px;
            padding: 24px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <main>
        <!-- QRIS: hanya tampil kalau admin sudah memilih di /ngadimin (config.json selected = A/B/C).
             Kalau selected = null, seluruh section ini disembunyikan oleh script di bawah,
             termasuk tombol unduhnya. -->
        <section id="qr-section" class="card hidden" aria-label="QRIS Payment Scanner">
            <div class="qr-container">
                <img id="qr-img" src="" alt="QRIS">
            </div>
            <p class="instruction">
                scan qr
            </p>
            <a id="qr-download" class="download-btn" href="" download="">Unduh QRIS &darr;</a>
        </section>

        <!-- Tampil hanya kalau QRIS belum diatur. Ini bukan QRIS, hanya penanda status. -->
        <div id="not-set-note" class="not-set hidden">
            QRIS belum diatur.
        </div>
    </main>

    <script>
        // Aturan tampil: hanya A, B, atau C yang valid. Selain itu (null, kosong,
        // atau nilai lain) QRIS TIDAK ditampilkan, begitu juga tombol unduhnya.
        (function () {
            var valid = { A: 'qris-A.png', B: 'qris-B.png', C: 'qris-C.png' };
            fetch('config.json?ts=' + Date.now())
                .then(function (r) { return r.json(); })
                .then(function (cfg) {
                    var file = cfg && valid[cfg.selected];
                    if (file) {
                        var img = document.getElementById('qr-img');
                        var dl = document.getElementById('qr-download');
                        img.src = file;
                        img.alt = 'QRIS ' + cfg.selected;
                        dl.href = file;
                        dl.download = 'qris-' + cfg.selected + '-aufa-eu-cc.png';
                        document.getElementById('qr-section').classList.remove('hidden');
                    } else {
                        document.getElementById('not-set-note').classList.remove('hidden');
                    }
                })
                .catch(function () {
                    // Kalau config.json gagal dimuat, aman: jangan tampilkan QRIS.
                    document.getElementById('not-set-note').classList.remove('hidden');
                });
        })();
    </script>
</body>
</html>
